external_services:
  - name: DeepSeek API（deepseek-v4.1-flash）
    purpose: Agent 理解问题、规划工具调用、组织答复；业务结论由规则工具计算
    credential_required: true
    credential_source: "ocft-backend/.env 的 LLM_API_KEY（enc: 密文 + 包内 master.key）"
    offline_fallback: false
    desensitization: >-
      企业全称、法人姓名、统一社会信用代码在外送前替换为代号；身份证、银行卡、手机号、邮箱掩码。
      2026-10-25 抽查 3 个真实 run、22 次调用，敏感原值命中 0（见 docs/10-strategy/脱敏复核证据-20261025/）。
  - name: MySQL 8.0（云端）
    purpose: 业务事实与执行记录、证据、审计持久化
    credential_required: true
    credential_source: "ocft-backend/config.yaml 的 database 段（enc: 密文）"
    offline_fallback: false
    desensitization: 不涉及外送；审计命中片段先做 PII 掩码；评委机出口 IP 须在云库白名单
  - name: Redis（云端）
    purpose: 缓存、计数与分布式锁（db/redis/）
    credential_required: true
    credential_source: "ocft-backend/config.yaml 的 redis 段（enc: 密文）"
    offline_fallback: false
    desensitization: 不涉及模型外送；评委机出口 IP 须在云库白名单
llm_declaration:
  - provider: DeepSeek
    model: deepseek-v4.1-flash
    usage: >-
      多 Agent 尽调：主控定位与调度 + 工商 / 财报 / 舆情 / 反欺诈 / 评级 / 报告角色解读与成文；
      数字由规则工具计算，模型不得改数。场景级累计 token 上限 200000（scenarios/dd04/agents.yaml controller.max_total_tokens）；
      不限工具轮数与总时长，单次调用超时见 LLM_TIMEOUT_SECONDS；公开集实测约 27 秒/笔申请、14 秒/题问询。
    data_sent: 系统提示词、代号/掩码后的用户问题与会话摘要、当次工具返回的官方样例业务数据（无真实客户）
    temperature: 0.2
third_party_components: []   # pack_dd04.py 用 submission/third_party_components.yaml 替换
datasets_used:
  official:
    - "docs/00-rules/赛题/赛题04_企业智能信贷尽调/data/（10 张业务 CSV + schema_relationships.csv；答案文件仅 eval 离线对照，运行时不读）"
  self_built:
    - ocft-backend/app/seed.py 与 db 导入链路中的虚构补充样例（不含评测答案映射）
  real_data_used: false
attachments: []   # pack_dd04.py 按队名与实物清单填充
