demo_env:
  type: local
  os: Windows 11（评测机为 Windows；不提供 Linux / macOS / Docker 方案）
  runtime: 内置 Python 3.14.9（vendor/python，python.org 官方构建）；评测机无需预装 Python / Node.js
  startup_command: start.bat（或 powershell -ExecutionPolicy Bypass -File .\start.ps1 -Offline）
  access_url: http://127.0.0.1:8000
  gpu_required: false
  network_required: true
  notes: >-
    解压后双击 start.bat：解压内置 Python，从 vendor/wheels/win_amd64-py3.14 离线安装后端依赖（pip --no-index），
    前端为预构建 ocft-starter/dist，由后端同源提供。包内含 .env / config.yaml（enc: 密文）与 master.key，解压即可用。
    依赖可离线安装，但运行时须能访问 DeepSeek API 与云端 MySQL / Redis（network_required: true）；
    评委机出口 IP 须加入云库白名单。场景 ID 为 enterprise_dd。首次启动约 2–4 分钟。
